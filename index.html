<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Verification</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Age-verification overlay -->
    <div id="age-overlay" class="overlay">
      <div class="modal">
        <h1>Age Verification</h1>
        <p>You must be of legal age to access this website. Please confirm your age to continue.</p>
        <div class="btn-group">
          <button id="btn-confirm-age" class="btn btn-confirm">I am of legal age</button>
          <button id="btn-deny-age" class="btn btn-deny">I am not</button>
        </div>
      </div>
    </div>

    <!-- Protected content (blurred until verified) -->
    <div id="main-content" class="content blurred">
      <h1>Welcome</h1>
      <p>This content is age-restricted. Thank you for verifying your age.</p>
      <p class="session-info" id="session-info"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
